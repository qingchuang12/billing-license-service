name: CI

# K14（2026-09-18 新建）：测试门禁。
# 此前仓库没有任何 CI，且 Dockerfile / package.sh 都带 -DskipTests —— 制品可以带着失败测试出厂。
# 本工作流跑全量单测（test profile 用 H2，无需数据库/密钥），未通过则禁止合并。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单元测试（JDK 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单测走 src/test/resources/application-test.yml（H2 + Flyway 关闭），
      # 因此不需要 DB / 渠道密钥 / SMTP 凭据等外部资源。
      # 基线：186 用例全绿（2026-09-18）。
      - name: mvn test
        run: mvn -B -ntp test
