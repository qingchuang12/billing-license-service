services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # 端口口径统一为 8000（K11）：与 application.yml 的 server.port 一致
      - "8000:8000"
    # K13（2026-09-18）：整个 .env 透传进容器 —— 此前只列了少数几个键，导致
    # APP_BASE_URL / 渠道密钥 / MAIL_* / ACCOUNT_CODE_PEPPER / BILLING_TRUST_XFF 等
    # 静默沿用镜像内默认值（含沙箱支付、localhost 回调）。下面 environment 的优先级高于 env_file。
    env_file:
      - .env
    environment:
      # 生产可显式指定 SPRING_PROFILES_ACTIVE=prod（关闭 Swagger 等，见 application-prod.yml）
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      # 数据源：指向同网络内的 postgres 服务（非 127.0.0.1），库名与 POSTGRES_DB 一致
      - DB_URL=jdbc:postgresql://postgres:5432/billing_db
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      # 账号体系（v2.10）：无默认值，缺失时 JwtTokenService 会 fail-fast 拒启。
      # 运行镜像内不含 .env（Dockerfile 只把 app.jar 放进 /app），故必须经此处显式注入。
      # 管理端鉴权 = 管理员 JWT（A12 / 2026-09-23 移除 X-API-Key，无独立 ADMIN_API_KEYS 变量）。
      - ACCOUNT_JWT_SECRET=${ACCOUNT_JWT_SECRET}
      # 二次因子主密钥（B8）：同上，无默认值，缺失即拒启
      - ACCOUNT_MFA_KEY=${ACCOUNT_MFA_KEY}
      - PRIVATE_KEY_PATH=/keys/private.key
      - PUBLIC_KEY_PATH=/keys/public.key
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - billing-network
    healthcheck:
      # i11/W22：eclipse-temurin:21-jre 不含 wget；已通过 Dockerfile 安装 curl 作为探针
      test: ["CMD", "curl", "-f", "http://localhost:8000/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    cpus: "1.0"

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      # i11/W22：Postgres 仅暴露到本机回环地址，避免发布到宿主机所有网卡被外网直接访问
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    cpus: "0.5"
    environment:
      - POSTGRES_DB=billing_db
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - billing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  billing-network:
    driver: bridge

volumes:
  postgres-data:
