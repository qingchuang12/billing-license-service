server:
  # 端口口径：全仓以 8000 为准（application.yml 是唯一权威源）。
  # Dockerfile 的 EXPOSE、docker-compose 的端口映射与 healthcheck、scripts/ops/healthcheck.sh、
  # 各文档示例 curl 均为 8000（K11，2026-09-18 统一，此前混用 8080 导致容器健康检查必失败）。
  port: 8000
spring:
  # 本地/联调配置源：加载项目根目录的 .env（已被 .gitignore 忽略，不入库）。
  # [.properties] 是官方 extension hint —— 让无扩展名的 .env 按 properties 格式解析；
  # optional: 保证该文件缺失时静默跳过，不影响容器 / CD 环境启动。
  # 详见项目根目录 .env 末尾的「怎么让它真正生效」说明。
  config:
    import: optional:file:.env[.properties]
  application:
    name: billing-license-service
  datasource:
    # 容器化部署时需通过 DB_URL 指向 postgres 服务名（compose 内为 postgres:5432）；本地联调由 .env 覆盖
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:10001/license}
    username: ${DB_USERNAME:license}
    # K10（2026-09-18）：口令类配置一律**无默认值**——缺失即拒启（fail-fast 真生效），
    # 避免仓库里的默认口令被带到线上。本地联调值写进项目根 .env（已 gitignore），键名见 .env.example。
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # H3：生产环境 schema 由 Flyway 全权管理，Hibernate 仅做校验，禁止自动改表（避免与迁移脚本漂移）
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # 现有库由 Flyway 之外（Hibernate ddl-auto / 手工）建表、无历史表，
    # 启动会因「非空 schema 无 history」中止。baseline 让 Flyway 记 baseline=v1、
    # 跳过 V1、跑 V2-V8。仅在现有表与 V1 一致时干净；若漂移，V2-V8 会报列已存在/缺失。
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:mail.ywhome.top}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:service@ywhome.top}
    # K10（2026-09-18）：邮箱口令无默认值（fail-fast）；原先内联在仓库里的真值已移出到 .env
    password: ${MAIL_PASSWORD:}
    from-address: ${MAIL_FROM_ADDRESS:service@ywhome.top}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        from-address: ${MAIL_FROM_ADDRESS:service@ywhome.top}

# Springdoc OpenAPI 文档开关：必须在顶层 springdoc 命名空间下才生效；
# 原误写在 spring: 下（变成 spring.api-docs.enabled，springdoc 不识别，等于无效配置）。
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    # 禁止回退到内置 petstore 示例地址（配置拉取异常时 UI 会默认加载 petstore.json）
    disable-swagger-default-url: true
    # 显式指定文档地址，避免依赖 configUrl 发现
    url: /v3/api-docs

# 计费与 License 配置
billing:
  # License 签名算法（实际支持集合，与 LocalKmsService / LicenseIssuer 实现对齐）：
  #   local:  ED25519（默认，需 DER 包装的原始密钥，见 C11）、ES256（EC）、RS256（RSA）
  # 注：ES384/ES512/RS384/RS512 当前实现未覆盖，声明即失效，故不在此列出（w13 收敛）
  signature-algorithm: ED25519
  # 私钥路径（用于签发 License）
  private-key-path: ${PRIVATE_KEY_PATH:/keys/private.key}
  # 公钥路径（分发给客户端用于验证 License）
  public-key-path: ${PUBLIC_KEY_PATH:/keys/public.key}
  # License 过期检查间隔（小时）
  license-check-interval-hours: 24
  # 默认 License 有效期（天）
  default-license-duration-days: 365
  # 权益特性显示名（中/英），配置驱动：改名只需改此处，前端零发版。
  # 键必须与 products.features 中的特性键一致（UPPER_SNAKE）。
  feature-labels:
    OFFLINE: { zh: "离线可用", en: "Offline capable" }
    MULTI_DEVICE: { zh: "多设备授权", en: "Multi-device" }
    EMAIL_SUPPORT: { zh: "邮件支持", en: "Email support" }
    PRIORITY_SUPPORT: { zh: "优先支持", en: "Priority support" }
    # 原名 API_ACCESS（2026-09-20 经 V3 迁移统一改名为 CLOUD_SYNC）
    CLOUD_SYNC: { zh: "云同步", en: "Cloud sync" }
  # H8：是否信任反向代理注入的 X-Forwarded-For 作为客户端真实 IP。
  # 默认 false（仅按 TCP remoteAddr 限流），避免攻击者伪造 XFF 绕过限流/风控。
  # 仅在确知前方是可信代理（如本服务的 ingress/gateway）时置 true。
  trust-x-forwarded-for: ${BILLING_TRUST_XFF:false}
  support-email: ${SUPPORT_EMAIL:service@ywhome.top}

# 支付渠道配置
# 说明：多渠道可「同时启用并存」，互不冲突。下单时由客户端传入的 provider 决定走哪个渠道
# 各渠道的回调入口固定为 /api/webhooks/{alipay,wechat,stripe,paddle,paypal}。
payment:
  # 启用的支付渠道（逗号分隔，大小写不敏感，空格会被忽略）
  # 例：PAYMENT_ENABLED_CHANNELS=stripe,alipay
  # 默认留空 = 自动判定：关键配置齐全的渠道自动启用，缺配置的自动禁用（本地未配任何渠道也能启动，便于联调/查看文档）
  # 显式配置时以本项为准；渠道名写错会直接启动失败（fail-fast），避免渠道莫名不可用
  # 启动日志会打印各渠道自检报告，也可调 GET /api/admin/payment-channels 在线查询
  # （可选值：alipay / wechat_pay / stripe / paddle / paypal）
  # K10（2026-09-18）：默认由 ALIPAY 改为**留空**——原默认值会让「未配任何渠道」的环境
  # 直接启用沙箱支付宝；留空即走自动判定，生产必须显式声明（APP_BASE_URL 与渠道密钥到位后再填）。
  enabled-channels: ${PAYMENT_ENABLED_CHANNELS:alipay}

  # 支付宝（国内）
  # K10：以下沙箱密钥（AppID / 应用私钥 / 支付宝公钥 / 网关地址）已从仓库移出，改为**无默认值**；
  # 本地联调值放项目根 .env，生产用真实开放平台应用值（网关 https://openapi.alipay.com/gateway.do）。
  alipay:
    # 开放平台应用 ID（AppID）
    app-id: ${ALIPAY_APP_ID:}
    # 商户应用私钥（RSA2，PKCS8），用于下单请求签名
    private-key: ${ALIPAY_PRIVATE_KEY:}
    # 支付宝公钥，用于异步通知验签（**不是**商户应用公钥，勿填错）。
    # 必须是「支付宝公钥」纯 RSA 公钥：base64 以 MIIBIjANBgkq 开头、单行、无换行与空格。
    # 切勿填 X.509 公钥证书（以 MIID 开头）——本工程走 AlipaySignature.rsaCheckV1（纯公钥模式），
    # 传证书会直接抛 InvalidKeyException: Unable to decode key content，下单与回调验签全链路失败。
    # 由 .env 的 ALIPAY_PUBLIC_KEY 注入（K10：无默认值，缺失即该渠道不可用）。
    public-key: ${ALIPAY_PUBLIC_KEY:}
    # 加签模式：PUBLIC_KEY（普通公钥）/ CERT（公钥证书）。
    # 留空 = 自动判定：下面三份证书路径齐全即走证书模式，否则走公钥模式。
    # 必须与应用在开放平台选择的加签方式一致，否则网关返回 isv.invalid-signature。
    sign-mode: ${ALIPAY_SIGN_MODE:}
    # 证书模式专用（三份 crt，从开放平台下载；路径可为 classpath: 或绝对/相对文件路径）：
    #   app-cert-path     应用公钥证书 appCertPublicKey_*.crt
    #   alipay-cert-path  支付宝公钥证书 alipayCertPublicKey_RSA2.crt
    #   root-cert-path    支付宝根证书 alipayRootCert.crt
    app-cert-path: ${ALIPAY_APP_CERT_PATH:}
    alipay-cert-path: ${ALIPAY_ALIPAY_CERT_PATH:}
    root-cert-path: ${ALIPAY_ROOT_CERT_PATH:}
    # 异步通知地址：默认由 app.base-url 派生，需与支付宝后台配置的 Notify URL 一致
    notify-url: ${ALIPAY_NOTIFY_URL:${app.base-url}/api/webhooks/alipay}
    # 网页支付完成后的回跳地址
    return-url: ${ALIPAY_RETURN_URL:${app.base-url}/payment/return}
    # 网关地址：生产 https://openapi.alipay.com/gateway.do；沙箱 https://openapi-sandbox.dl.alipaydev.com/gateway.do
    # K10：无默认值 —— 留默认沙箱地址会让生产部署静默打到沙箱（「收钱不发货」的高危配置）
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    # 签名类型：RSA2（SHA256withRSA），与支付宝后台保持一致
    sign-type: ${ALIPAY_SIGN_TYPE:RSA2}

  # 微信支付（国内，API v3）
  wechat:
    # 公众号/小程序 AppID
    app-id: ${WECHAT_APP_ID:}
    # 商户号（mchid）
    mch-id: ${WECHAT_MCH_ID:}
    # APIv3 密钥（32 字符），用于回调报文与平台证书的 AES-256-GCM 解密
    api-key: ${WECHAT_API_KEY:}
    # 商户 API 私钥文件路径（apiclient_key.pem），用于上行请求签名/keys/wechat/apiclient_key.pem
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
    # 商户证书文件路径（apiclient_cert.pem），用于提取商户证书序列号/keys/wechat/apiclient_cert.pem
    certificate-path: ${WECHAT_CERT_PATH:}
    # 回调地址：默认由 app.base-url 派生，需与商户平台配置的回调地址一致
    notify-url: ${WECHAT_NOTIFY_URL:${app.base-url}/api/webhooks/wechat}

  # Stripe（国际信用卡 / Apple Pay / Google Pay）
  stripe:
    # API 密钥（sk_test_xxx 测试 / sk_live_xxx 生产）
    api-key: ${STRIPE_API_KEY:}
    # Webhook 签名密钥（whsec_xxx），缺失会导致所有回调验签失败（收钱不发货）
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # 结账成功回跳地址（会自动追加 ?session_id={CHECKOUT_SESSION_ID}）
    success-url: ${STRIPE_SUCCESS_URL:${app.base-url}/payment/success}
    # 结账取消回跳地址
    cancel-url: ${STRIPE_CANCEL_URL:${app.base-url}/payment/cancel}

  # Paddle（国际，Merchant of Record，代收代缴税费）
  paddle:
    # 卖家 ID / Vendor ID
    vendor-id: ${PADDLE_VENDOR_ID:}
    # Paddle API Key
    api-key: ${PADDLE_API_KEY:}
    # API 地址（沙箱 https://sandbox-api.paddle.com / 生产 https://api.paddle.com）
    environment: ${PADDLE_ENVIRONMENT:https://sandbox-api.paddle.com}
    # Webhook 签名密钥，用于 HMAC-SHA256 验签（Paddle-Signature 头的 ts/h1）
    webhook-secret: ${PADDLE_WEBHOOK_SECRET:}

  # PayPal（国际钱包）
  paypal:
    # 应用 Client ID
    client-id: ${PAYPAL_CLIENT_ID:}
    # 应用 Client Secret
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    # API 地址（沙箱 https://api-m.sandbox.paypal.com / 生产 https://api-m.paypal.com）
    environment: ${PAYPAL_ENVIRONMENT:https://api-m.sandbox.paypal.com}
    # Webhook ID，回调验签必需（在 PayPal 后台创建 Webhook 后获得）
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
    # 支付完成回跳地址
    return-url: ${PAYPAL_RETURN_URL:${app.base-url}/payment/return}
    # 支付取消回跳地址
    cancel-url: ${PAYPAL_CANCEL_URL:${app.base-url}/payment/cancel}

# 账号体系配置（plan v2.10）
account:
  # 用户令牌签名密钥（HS256，对称）：**无默认值**，缺失即启动失败（fail-fast）。
  # K10（2026-09-18）：原先内联的 base64 默认值已移出仓库；本地/生产均在 .env 或环境变量注入。
  jwt-secret: ${ACCOUNT_JWT_SECRET}
  # 令牌有效期（小时），默认 7 天
  token-ttl-hours: ${ACCOUNT_TOKEN_TTL_HOURS:168}
  # 注册是否强制邮箱验证码（联调期可临时置 false）
  require-email-verification: ${ACCOUNT_REQUIRE_EMAIL_VERIFICATION:true}
  # 验证码位数与有效期
  code-length: ${ACCOUNT_CODE_LENGTH:6}
  code-ttl-minutes: ${ACCOUNT_CODE_TTL_MINUTES:10}
  # 验证码哈希 pepper：生产必配（库被读时防止 6 位数字被彩虹表反查）
  code-pepper: ${ACCOUNT_CODE_PEPPER:}
  # 联调模式：验证码仅写日志不发邮件（绕过未配置的 SMTP，避免注册/找回链路被阻塞）
  code-log-only: ${ACCOUNT_CODE_LOG_ONLY:false}
  # 密码策略
  password-min-length: ${ACCOUNT_PASSWORD_MIN_LENGTH:8}
  password-require-alnum: ${ACCOUNT_PASSWORD_REQUIRE_ALNUM:true}
  # 风控阈值（与 plan v2.10 第五节矩阵一一对应）
  risk:
    login-account-fail-max: ${ACCOUNT_LOGIN_ACCOUNT_FAIL_MAX:5}
    login-account-lock-minutes: ${ACCOUNT_LOGIN_ACCOUNT_LOCK_MINUTES:15}
    login-ip-fail-max: ${ACCOUNT_LOGIN_IP_FAIL_MAX:20}
    login-ip-fail-window-minutes: ${ACCOUNT_LOGIN_IP_FAIL_WINDOW_MINUTES:10}
    # 发送冷却单位为秒（RateLimitService 窗口以分钟计，调用处向上取整换算）
    code-send-cooldown-seconds: ${ACCOUNT_CODE_SEND_COOLDOWN_SECONDS:60}
    code-send-email-max: ${ACCOUNT_CODE_SEND_EMAIL_MAX:5}
    code-send-email-window-minutes: ${ACCOUNT_CODE_SEND_WINDOW_MINUTES:60}
    code-send-ip-max: ${ACCOUNT_CODE_SEND_IP_MAX:10}
    code-verify-fail-max: ${ACCOUNT_CODE_VERIFY_FAIL_MAX:5}
    register-ip-max: ${ACCOUNT_REGISTER_IP_MAX:5}
    register-email-max: ${ACCOUNT_REGISTER_EMAIL_MAX:3}
    register-window-minutes: ${ACCOUNT_REGISTER_WINDOW_MINUTES:60}
    reset-email-max: ${ACCOUNT_RESET_EMAIL_MAX:5}
    reset-ip-max: ${ACCOUNT_RESET_IP_MAX:10}
    reset-window-minutes: ${ACCOUNT_RESET_WINDOW_MINUTES:60}
    change-password-user-max: ${ACCOUNT_CHANGE_PWD_USER_MAX:3}
    change-password-window-minutes: ${ACCOUNT_CHANGE_PWD_WINDOW_MINUTES:60}

# 安全配置
security:
  api-key-header: X-API-Key
  # 管理端密钥：**无默认值**，缺失即启动失败。多个密钥用英文逗号分隔。
  # K10（2026-09-18）：原先内联的 64 位默认值已移出仓库（注释自 2026-09-16 起即声明 fail-fast，
  # 但实际仍有默认值，属语义自相矛盾）；本地/联调值见项目根目录 .env，测试值见 application-test.yml。
  admin-api-keys: ${ADMIN_API_KEYS}

# 应用对外基址
app:
  # 【上线必配】公网可达的对外基址，用于拼接各渠道的回调与回跳地址。
  # K10（2026-09-18）：改为**无默认值**（fail-fast）——原来默认 `https://localhost:8080`，
  # 一旦忘记覆盖，渠道回调地址就是 localhost，用户付款后订单永远不发货（B1 高危配置）。
  # 本地联调：APP_BASE_URL=http://localhost:8000（服务端口见 server.port）
  # 生产：APP_BASE_URL=https://api.ywhome.top
  base-url: ${APP_BASE_URL:http://localhost:8000}
  # H9：CORS 允许的源头（逗号分隔）。留空表示不开放跨域（纯服务端 API 默认关闭）。
  # 部署前端独立域名时再显式填入，如 https://shop.example.com
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

# H13：Actuator 健康检查与探针（上线前必配）
management:
  endpoints:
    web:
      exposure:
        # 仅暴露健康与基本信息；敏感端点（env/beans/heapdump 等）默认不暴露
        include: health,info
        exclude: env,beans,configprops,heapdump,threaddump,loggers
  endpoint:
    health:
      # 聚合应用、DB、KMS 等组件健康；分组探针供 k8s 使用
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: db
        liveness:
          include: db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    # 生产禁用 DEBUG：会打印 License token 与支付回调 payload 等敏感信息
    com.billing.license: INFO
    org.springframework.security: INFO
