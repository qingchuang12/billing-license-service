# 测试专用 Profile（H13/M4）：使用内存 H2 取代 PostgreSQL + Flyway，
# 并补齐生产 application.yml 中"无默认值、缺失即启动失败"的必填项，
# 使 @SpringBootTest 上下文加载与 Actuator 健康探针可在本地（无 Docker）运行。
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 测试用 create-drop 由实体自动建表，避免依赖 Postgres 专属 Flyway 迁移
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
    username: test
    # K10（2026-09-18）：application.yml 中邮箱口令已无默认值（fail-fast），此处补齐；
    # 测试不真发信（EmailNotificationService 在用户名/口令为空时跳过发送）。
    password: test

# 补齐生产必填项（无默认值）：账号令牌签名密钥与 DB 口令
# v2.10：account.jwt-secret 无默认值、缺失即启动失败（fail-fast），
# 故测试环境必须显式提供（≥32 字节，仅用于测试，禁止复用到生产）
account:
  jwt-secret: test-only-jwt-secret-for-unit-tests-0123456789abcdef

# K10（2026-09-18）：app.base-url 在 application.yml 中已改为无默认值（fail-fast，
# 防「默认 localhost 导致渠道回调不可达」），测试 profile 必须补齐。
app:
  base-url: http://localhost:8000

# H13：测试中放开健康详情，便于断言探针状态
management:
  endpoint:
    health:
      show-details: always
